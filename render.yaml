services:
  - type: web
    name: ontario-energy-explorer
    runtime: docker
    branch: main
    plan: free
    # Build from the repo root so the image can include data/final_predictions_22-26.
    dockerContext: .
    dockerfilePath: ./energy-explorer/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
